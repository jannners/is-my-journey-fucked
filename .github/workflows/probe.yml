# One-off: checks which live train-time sources a web page can use. Started by hand only.
name: Probe live data sources
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/probe.mjs
      - run: |
          cd results && git init -q -b probe-results && git config user.name probe && git config user.email probe@users.noreply.github.com
          git add . && git commit -qm probe && git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" probe-results
